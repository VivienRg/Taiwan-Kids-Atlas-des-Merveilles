# Taiwan Kids Atlas — Supabase production changes.
#
# This workflow NEVER runs on a push or a pull request. Every action is started
# by hand from the Actions tab (workflow_dispatch) and every write path sits
# behind the `production` GitHub Environment, so it waits for a human reviewer
# before a single statement reaches the hosted project.
#
# Actions:
#   plan          — read-only: link, pending migrations (--dry-run), function list
#   migrate       — `supabase db push` (applies supabase/migrations to prod)
#   function      — `supabase functions deploy ingest`
#   secrets       — `supabase secrets set` for the function runtime
#   cron-enable   — `select atlas.sync_cron_schedules()` (starts daily ingestion)
#   cron-disable  — `select atlas.unschedule_all()`  (pause switch / rollback)
#
# Step-by-step instructions, including the approval gate and the Vault secrets,
# are in docs/release.md. Required repository secrets: docs/secrets.md §3.
#
# No credential lives in this file, and no `${{ }}` expression is interpolated
# directly into a shell command — inputs and secrets are passed through `env:`
# so a value can never be re-parsed as shell syntax.

name: Supabase (production, manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do against the hosted project
        type: choice
        required: true
        default: plan
        options:
          - plan
          - migrate
          - function
          - secrets
          - cron-enable
          - cron-disable
      confirm:
        description: Type "APPLY" to allow a write action (ignored by plan)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # One production change at a time.
  group: supabase-production
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (read-only)
    if: ${{ inputs.action == 'plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link, diff and list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"
          echo "── pending migrations (dry run: nothing is applied)"
          supabase db push --dry-run
          echo "── deployed functions"
          supabase functions list

  migrate:
    name: Apply migrations
    if: ${{ inputs.action == 'migrate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::refusing to write: set the confirm input to APPLY"; exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"
          supabase db push          # pending files only; never --include-all

  function:
    name: Deploy the ingest Edge Function
    if: ${{ inputs.action == 'function' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::refusing to write: set the confirm input to APPLY"; exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy (JWT verification stays off — config.toml [functions.ingest])
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF"
          supabase functions deploy ingest

  secrets:
    name: Set the ingest runtime secrets
    if: ${{ inputs.action == 'secrets' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::refusing to write: set the confirm input to APPLY"; exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push the function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CRON_SECRET: ${{ secrets.INGEST_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::INGEST_CRON_SECRET is not set (docs/secrets.md §3)"; exit 1
          fi
          supabase secrets set \
            INGEST_CRON_SECRET="$CRON_SECRET" \
            INGEST_LOG_LEVEL=info \
            INGEST_DEADLINE_MS=120000 \
            --project-ref "$PROJECT_REF"

  cron:
    name: Enable or disable the ingestion cron
    if: ${{ inputs.action == 'cron-enable' || inputs.action == 'cron-disable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::refusing to write: set the confirm input to APPLY"; exit 1
          fi
      - name: Install psql
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Manage atlas cron jobs
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL is not set (docs/secrets.md §3)"; exit 1
          fi
          if [ "$ACTION" = "cron-enable" ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "select atlas.sync_cron_schedules() as scheduled_job;"
          else
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "select atlas.unschedule_all() as jobs_removed;"
          fi
          psql "$DATABASE_URL" -c "select jobname, schedule, active from cron.job order by jobname;"
