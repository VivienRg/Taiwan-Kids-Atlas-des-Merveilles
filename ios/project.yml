# XcodeGen manifest. Run `xcodegen generate` in this folder to produce TaiwanKidsAtlas.xcodeproj.
name: TaiwanKidsAtlas
options:
  bundleIdPrefix: io.roggero.kidsatlas
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  TaiwanKidsAtlas:
    type: application
    platform: iOS
    sources:
      - path: TaiwanKidsAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.roggero.kidsatlas.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Kids Atlas
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"

  TaiwanKidsAtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TaiwanKidsAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.roggero.kidsatlas.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TaiwanKidsAtlas:
    build:
      targets:
        TaiwanKidsAtlas: all
        TaiwanKidsAtlasTests: [test]
    test:
      targets:
        - TaiwanKidsAtlasTests
